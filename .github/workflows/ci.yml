name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run ruff check src tests
      - run: uv run pytest -ra
      - run: uv run fr trap-pack

  docker-sandbox:
    # The live-mode sandbox, for real: build the image, run the Docker tests and a full
    # mock run with every check executed inside the locked-down container.
    runs-on: ubuntu-latest
    env:
      FR_REQUIRE_DOCKER: "1"   # Docker tests must run here: a skip fails the job instead of passing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync
      - run: uv run fr sandbox-build
      - run: uv run pytest tests/test_docker_sandbox.py -ra
      - run: MOCK_SANDBOX=docker uv run fr run --mock lint
      - run: MOCK_SANDBOX=docker uv run fr run --mock broken
      - run: MOCK_SANDBOX=docker uv run fr trap-pack
