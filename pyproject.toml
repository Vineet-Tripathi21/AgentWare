[project]
name = "first-responder"
version = "0.1.0"
description = "An unattended first-pass agent for GitHub pull requests that knows when to stop."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    # Used by the *local* sandbox backend (mock mode only) to run the target repo's checks.
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
fr = "fr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
extend-exclude = ["fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E731", "E501"]
